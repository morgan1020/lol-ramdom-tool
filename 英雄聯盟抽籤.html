<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>英雄聯盟抽籤統計（高隨機性版）</title>
<style>
  :root {
    --bg: #f0f2f5;
    --fg: #333;
    --card: #fff;
    --brand: #3498db;
    --brand-2: #2980b9;
    --ok: #27ae60;
    --ok-2: #1e8449;
    --danger: #e74c3c;
    --danger-2: #c0392b;
    --muted: #95a5a6;
    --shadow: 0 4px 8px rgba(0,0,0,.08);
  }
  * { box-sizing: border-box; }
  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); margin: 0; padding: 20px; color: var(--fg); }
  h1 { color: #2c3e50; text-align: center; }
  .container { max-width: 980px; margin: 0 auto; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  input { padding: 10px 12px; width: 220px; border-radius: 8px; border: 1px solid #d0d7de; outline: none; }
  input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(52,152,219,.15); }
  button { padding: 10px 14px; border-radius: 10px; border: none; background: var(--brand); color: #fff; font-weight: 700; cursor: pointer; transition: .25s; box-shadow: var(--shadow); position: relative; }
  button:hover { background: var(--brand-2); transform: translateY(-1px); }
  button:disabled { background: #b3c7da; cursor: not-allowed; transform: none; }
  .btn-ok { background: var(--ok); }
  .btn-ok:hover { background: var(--ok-2); }
  .btn-danger { background: var(--danger); }
  .btn-danger:hover { background: var(--danger-2); }
  .card { background: var(--card); padding: 16px; margin: 16px 0; border-radius: 14px; box-shadow: var(--shadow); }
  .muted { color: var(--muted); font-size: 14px; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  th, td { padding: 10px 14px; border: 1px solid #e5e7eb; text-align: center; }
  thead { background: var(--brand); color: #fff; }
  tbody tr:hover { background: #f8fafc; }
  #selected-players li { display: inline-flex; align-items: center; gap: 8px; background: #ecf0f1; margin: 6px; padding: 6px 12px; border-radius: 10px; }
  #selected-players li button { background: var(--danger); padding: 6px 8px; }
  #selected-players li button:hover { background: var(--danger-2); }
  #toast-wrap { position: fixed; top: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 9999; }
  .toast { min-width: 260px; max-width: 360px; padding: 12px 14px; border-radius: 12px; color: #fff; box-shadow: var(--shadow); display: flex; align-items: flex-start; gap: 10px; animation: slideIn .25s ease-out; }
  .toast.info { background: #2d8cf0; }
  .toast.success { background: #2ecc71; }
  .toast.warn { background: #f39c12; }
  .toast.error { background: #e74c3c; }
  .toast .title { font-weight: 700; margin-right: 6px; }
  .toast .msg { opacity: .95; }
  .toast .close { margin-left: auto; background: transparent; border: 0; color: #fff; font-weight: bold; cursor: pointer; }
  @keyframes slideIn { from { transform: translateY(-8px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .loading::after { content: ""; position: absolute; right: 10px; top: 50%; width: 14px; height: 14px; margin-top: -7px; border-radius: 50%; border: 2px solid rgba(255,255,255,.65); border-top-color: #fff; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .inline-kv { display: flex; gap: 10px; flex-wrap: wrap; align-items: baseline; }
</style>
</head>
<body>
<div id="toast-wrap" aria-live="polite" aria-atomic="true"></div>
<div class="container">
  <h1>英雄聯盟抽籤統計</h1>
  <div class="card">
    <div class="row">
      <input type="text" id="manual-player" placeholder="輸入玩家名稱" />
      <button id="btn-add" class="btn-ok">加入抽籤</button>
      <button id="btn-draw">抽籤</button>
      <button id="btn-clear" class="btn-danger">清空統計</button>
    </div>
    <div class="inline-kv" style="margin-top:8px;">
      <span class="muted">抽籤人數上限：5 人</span>
      <span class="muted">｜</span>
      <span class="muted">上次抽籤時間：<strong id="last-draw">尚未抽過</strong></span>
    </div>
  </div>

  <div class="card">
    <h2>抽籤候選名單（目前抽籤人數 <span id="current-count">0</span>/5）</h2>
    <ul id="selected-players"></ul>
  </div>

  <div class="card">
    <div class="row" style="justify-content: space-between; align-items: center;">
      <h2 style="margin: 6px 0;">抽籤結果</h2>
      <button id="btn-copy" class="btn-ok">一鍵複製結果</button>
    </div>
    <table id="result-table" style="display:none;">
      <thead>
        <tr><th>玩家</th><th>主要位置</th><th>次要位置</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="card">
    <h2>統計內容（主要 +1，次要 +0.5）</h2>
    <table id="stats-table">
      <thead>
        <tr><th>玩家名稱</th><th>上路</th><th>打野</th><th>中路</th><th>下路</th><th>輔助</th><th>加入抽籤</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>
<script>
const positions = ["上路", "打野", "中路", "下路", "輔助"];
let selectedPlayers = [];
const STORAGE_STATS = "lolDrawStats";
const STORAGE_LAST = "lolLastDrawAt";
function toast(type,title,msg,timeout=2400){const wrap=document.getElementById('toast-wrap');const el=document.createElement('div');el.className=`toast ${type}`;el.innerHTML=`<span class=\"title\">${title}</span><span class=\"msg\">${msg||''}</span><button class=\"close\">×</button>`;el.querySelector('.close').onclick=()=>el.remove();wrap.appendChild(el);setTimeout(()=>el.remove(),timeout);} 
function formatTime(ts){const d=new Date(ts);return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;}
function setBusy(btn,busy){if(!btn)return;btn.disabled=!!busy;btn.classList.toggle('loading',!!busy);}
function cryptoRandom(max){const array=new Uint32Array(1);crypto.getRandomValues(array);return array[0]%max;}
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=cryptoRandom(i+1);[arr[i],arr[j]]=[arr[j],arr[i]];}}
function displayStats(){const stats=JSON.parse(localStorage.getItem(STORAGE_STATS)||'{}');const tbody=document.querySelector('#stats-table tbody');tbody.innerHTML='';for(const n in stats){const r=document.createElement('tr');r.innerHTML=`<td>${n}</td><td>${stats[n]['上路']}</td><td>${stats[n]['打野']}</td><td>${stats[n]['中路']}</td><td>${stats[n]['下路']}</td><td>${stats[n]['輔助']}</td><td><button class='btn-ok' onclick=\"addPlayerFromStats('${n}')\">加入抽籤</button></td>`;tbody.appendChild(r);}}
function addPlayerFromStats(n){if(selectedPlayers.includes(n))return toast('warn','提醒','玩家已在抽籤名單中');if(selectedPlayers.length>=5)return toast('warn','已達上限','抽籤人數已滿 5 人');selectedPlayers.push(n);updateSelectedList();toast('success','加入成功',`${n} 已加入抽籤名單`);}
function addManualPlayer(){const i=document.getElementById('manual-player');const n=i.value.trim();if(!n)return toast('warn','未輸入','請先輸入玩家名稱');if(selectedPlayers.includes(n))return toast('warn','提醒','玩家已在抽籤名單中');if(selectedPlayers.length>=5)return toast('warn','已達上限','抽籤人數已滿 5 人');const s=JSON.parse(localStorage.getItem(STORAGE_STATS)||'{}');if(!s[n])s[n]={"上路":0,"打野":0,"中路":0,"下路":0,"輔助":0};localStorage.setItem(STORAGE_STATS,JSON.stringify(s));selectedPlayers.push(n);updateSelectedList();displayStats();i.value='';toast('success','加入成功',`${n} 已加入抽籤名單`);}
function updateSelectedList(){const ul=document.getElementById('selected-players');ul.innerHTML='';selectedPlayers.forEach(n=>{const li=document.createElement('li');li.textContent=n+' ';const b=document.createElement('button');b.textContent='移除';b.onclick=()=>{selectedPlayers=selectedPlayers.filter(p=>p!==n);updateSelectedList();toast('info','已移除',`${n} 已從抽籤名單移除`);};li.appendChild(b);ul.appendChild(li);});document.getElementById('current-count').textContent=selectedPlayers.length;}
function drawLots(){if(selectedPlayers.length===0)return toast('warn','尚未選人','請先選擇玩家');const btn=document.getElementById('btn-draw');setBusy(btn,true);try{const res=[];const names=[...selectedPlayers];const pos=[...positions];shuffle(pos);if(names.length>pos.length){toast('error','人數過多','玩家數量超過位置數量！');return;}for(let i=0;i<names.length;i++){res.push({name:names[i],main:pos[i],secondary:''});}if(names.length<5){let attempts=0;const max=1000;while(attempts<max){attempts++;res.forEach(r=>{const p=positions.filter(x=>x!==r.main);r.secondary=p[cryptoRandom(p.length)];});const combos=res.map(r=>[r.main,r.secondary].sort().join('|'));const u=new Set(combos);if(u.size===res.length)break;if(attempts===max)return toast('error','抽籤失敗','無法生成合法組合，請重試');}}
displayResults(res);updateStats(res);const now=Date.now();localStorage.setItem(STORAGE_LAST,String(now));renderLastDraw();toast('success','抽籤完成','結果已產生並更新統計');}finally{setBusy(btn,false);}}
function displayResults(r){const tb=document.querySelector('#result-table tbody');tb.innerHTML='';r.forEach(x=>{const row=document.createElement('tr');row.innerHTML=`<td>${x.name}</td><td>${x.main}</td><td>${x.secondary||'-'}</td>`;tb.appendChild(row);});document.getElementById('result-table').style.display='table';}
function updateStats(r){const s=JSON.parse(localStorage.getItem(STORAGE_STATS)||'{}');r.forEach(x=>{if(!s[x.name])s[x.name]={"上路":0,"打野":0,"中路":0,"下路":0,"輔助":0};s[x.name][x.main]+=1;if(x.secondary)s[x.name][x.secondary]+=0.5;});localStorage.setItem(STORAGE_STATS,JSON.stringify(s));displayStats();}
function copyResults(){const rows=document.querySelectorAll('#result-table tbody tr');if(rows.length===0)return toast('warn','沒有資料','目前沒有抽籤結果');let text='';rows.forEach(r=>{const c=r.querySelectorAll('td');text+=`${c[0].textContent}：主要 ${c[1].textContent}｜次要 ${c[2].textContent}\n`;});navigator.clipboard.writeText(text).then(()=>toast('success','已複製','抽籤結果已複製到剪貼簿'));}
function clearStats(){if(!confirm('確定要清空所有統計資料嗎？'))return;localStorage.removeItem(STORAGE_STATS);selectedPlayers=[];updateSelectedList();displayStats();toast('info','已清空','統計資料已全部清除');}
function renderLastDraw(){const el=document.getElementById('last-draw');const ts=localStorage.getItem(STORAGE_LAST);el.textContent=ts?formatTime(Number(ts)):'尚未抽過';}
window.addEventListener('DOMContentLoaded',()=>{document.getElementById('btn-add').addEventListener('click',()=>{const b=document.getElementById('btn-add');setBusy(b,true);try{addManualPlayer();}finally{setBusy(b,false);}});document.getElementById('btn-draw').addEventListener('click',drawLots);document.getElementById('btn-clear').addEventListener('click',clearStats);document.getElementById('btn-copy').addEventListener('click',()=>{const b=document.getElementById('btn-copy');setBusy(b,true);try{copyResults();}finally{setBusy(b,false);}});displayStats();selectedPlayers=[];updateSelectedList();renderLastDraw();});
</script>
</body>
</html>
